[project]
    name = "jaimead7-home-assistant-api-gateway"
    version = "0.0.1"
    description = "Api Gateway for the Home Assistant project."
    authors = [
        {name = "Jaimead7", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    maintainers = [
        {name = "Jaimead7", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    readme = {file = "README.md", content-type = "text/markdown"}
    license = "MIT"
    license-files = [
        "LICENSE",
    ]
    keywords = [
        "Home Assistant",
        "Academic",
        "API Gateway",
    ]
    classifiers = [
        "License :: OSI Approved :: MIT License",
        "Programming Language :: Python :: 3.13",
    ]
    dependencies = [
        
    ]
    requires-python = ">=3.13"

    [project.urls]
        Homepage = "https://github.com/Jaimead7/HomeAssistant"
        Repository = "https://github.com/Jaimead7/HomeAssistant"