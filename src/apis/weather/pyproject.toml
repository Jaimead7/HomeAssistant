[project]
    name = "jaimead7-weather-api"
    version = "0.0.1"
    description = "An API for weather information."
    authors = [
        {name = "Jaimead7", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    maintainers = [
        {name = "Jaimead7", email = "alvarez.diaz.jaime1@gmail.com"},
    ]
    readme = {file = "README.md", content-type = "text/markdown"}
    license = "MIT"
    license-files = [
        "LICENSE",
    ]
    keywords = [
        "Academic",
        "API",
        "Weather",
    ]
    classifiers = [
        "License :: OSI Approved :: MIT License",
        "Programming Language :: Python :: 3.13",
    ]
    dependencies = [
        "fastapi >= 0.115.12"
    ]
    requires-python = ">=3.13"

    [project.urls]
        Homepage = "https://github.com/Jaimead7/HomeAssistant"
        Repository = "https://github.com/Jaimead7/HomeAssistant"